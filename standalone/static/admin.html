<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>検査情報 管理</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- ログイン -->
  <section id="loginView">
    <form id="loginForm" class="panel login-box">
      <h2>管理者ログイン</h2>
      <p class="help">内容の変更は、登録された管理者だけが行えます。</p>
      <label class="field"><span>ユーザー名</span>
        <input id="userInput" type="text" autocomplete="username" required>
      </label>
      <label class="field"><span>パスワード</span>
        <input id="passInput" type="password" autocomplete="current-password" required>
      </label>
      <div id="loginMsg"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button id="loginBtn" class="btn primary" type="submit">ログイン</button>
      </div>
      <p class="help" style="margin-top:16px"><a href="./">← 閲覧画面へ戻る</a></p>
    </form>
  </section>

  <!-- 編集 -->
  <section id="editView" hidden>
    <header class="app-header admin-bar">
      <h1 class="app-title">検査情報 管理<small id="whoami"></small></h1>
      <div class="header-tools">
        <select id="productSelect" aria-label="製品を選択"></select>
        <button id="addProductBtn" class="btn small" type="button">＋ 製品追加</button>
        <span class="spacer"></span>
        <span id="dirtyFlag" class="dirty-flag"></span>
        <button id="historyBtn" class="btn small" type="button">変更履歴</button>
        <button id="importBtn" class="btn small" type="button">JSON読込</button>
        <button id="exportBtn" class="btn small" type="button">JSON出力</button>
        <button id="saveBtn" class="btn small primary" type="button">保存（公開）</button>
        <a class="btn small" href="./" target="_blank" rel="noopener">閲覧画面</a>
        <button id="logoutBtn" class="btn small" type="button">ログアウト</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </header>
    <div id="globalMsg" style="max-width:1400px;margin:0 auto;padding:0 16px"></div>
    <main class="layout">
      <aside class="panel sidebar">
        <ul id="editList" class="item-list"></ul>
        <div style="padding:8px 12px 12px">
          <button id="addItemBtn" class="btn small" type="button" style="width:100%;justify-content:center">＋ 検査項目を追加</button>
        </div>
      </aside>
      <section class="panel">
        <div id="editor" class="editor"></div>
      </section>
    </main>
  </section>

  <!-- 変更履歴 -->
  <dialog id="historyDialog" class="panel history-dialog">
    <div class="history-head">
      <h2>変更履歴</h2>
      <button id="historyClose" class="btn small" type="button">閉じる</button>
    </div>
    <p class="help">「この版を読み込む」で編集画面に読み込みます。内容を確認してから「保存（公開）」すると、その版に戻ります。</p>
    <div id="historyBody" class="table-wrap"></div>
  </dialog>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
